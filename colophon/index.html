<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/home/vendor/react.production.min.js"></script>
    <script src="/home/vendor/react-dom.production.min.js"></script>
    <script src="/home/support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <title>Colophon – Bhanu Cheepurupalli</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #f2ead6;
            color: #1f2e4d;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: #456264;
          }
          a:hover {
            color: #456264;
          }
          a[data-link] {
            position: relative;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
          }
          a[data-link]:hover {
            text-decoration-thickness: 2px;
          }
          /* Widens each link's tap target to at least 44 by 44 px without moving the layout. */
          a[data-link]::after {
            content: "";
            position: absolute;
            top: calc(50% - 22px);
            bottom: calc(50% - 22px);
            left: 50%;
            width: max(100%, 44px);
            transform: translateX(-50%);
          }
          a[data-link]:focus {
            outline: none;
          }
          a[data-link]:focus-visible {
            outline: 1px solid #1f2e4d;
            outline-offset: 2px;
          }
        </style>
      </helmet>
      <div
        style="
          min-height: 100vh;
          background: #f2ead6;
          color: #1f2e4d;
          font-family: &quot;Archivo&quot;, system-ui, sans-serif;
        "
      >
        <header
          style="
            display: flex;
            align-items: center;
            min-height: 56px;
            padding: 12px clamp(16px, 4vw, 32px);
          "
        >
          <nav
            aria-label="Site"
            style="
              flex: 1;
              display: flex;
              justify-content: space-between;
              gap: 24px;
              font-size: 13px;
              line-height: 20px;
              letter-spacing: 0.01em;
            "
          >
            <a data-link="" href="/home/">The house</a>
            <a data-link="" href="/home/index">Index</a>
          </nav>
        </header>

        <main
          style="
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: 720px;
            padding: 24px clamp(16px, 4vw, 32px) 56px;
          "
        >
          <h1
            style="
              margin: 0;
              font-family: &quot;EB Garamond&quot;, Georgia, serif;
              font-weight: 400;
              font-size: 40px;
              line-height: 1.12;
              letter-spacing: -0.01em;
            "
            >Colophon</h1
          >

          <dl
            style="
              margin: 0;
              padding-top: 12px;
              border-top: 1px solid #1f2e4d;
              display: flex;
              flex-direction: column;
              gap: 24px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <dt style="font-size: 13px; line-height: 1.5; letter-spacing: 0.01em; color: #545d6f"
                >Type</dt
              >
              <dd
                style="
                  margin: 0;
                  max-width: 62ch;
                  font-family: &quot;EB Garamond&quot;, Georgia, serif;
                  font-size: 18px;
                  line-height: 1.7;
                  text-wrap: pretty;
                "
                >EB Garamond, Archivo and Pinyon Script, from Google Fonts.</dd
              >
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <dt style="font-size: 13px; line-height: 1.5; letter-spacing: 0.01em; color: #545d6f"
                >Access</dt
              >
              <dd
                style="
                  margin: 0;
                  max-width: 62ch;
                  font-family: &quot;EB Garamond&quot;, Georgia, serif;
                  font-size: 18px;
                  line-height: 1.7;
                  text-wrap: pretty;
                "
                >The site works by keyboard. The pause button on the house stops its motion, and the
                site follows the reader's reduced-motion setting.</dd
              >
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <dt style="font-size: 13px; line-height: 1.5; letter-spacing: 0.01em; color: #545d6f"
                >Corrections</dt
              >
              <dd
                style="
                  margin: 0;
                  max-width: 62ch;
                  font-family: &quot;EB Garamond&quot;, Georgia, serif;
                  font-size: 18px;
                  line-height: 1.7;
                  text-wrap: pretty;
                "
                >Coming soon</dd
              >
            </div>
          </dl>
        </main>
      </div>
    </x-dc>
  </body>
</html>
